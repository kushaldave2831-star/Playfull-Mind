<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent/Teacher Dashboard - Playfull Minds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Balsamiq+Sans:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/games.css">
    <style>
        .dashboard-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .badge-small {
            display: inline-block;
            margin: 0.5rem;
            padding: 0.75rem;
            border-radius: 10px;
            background-color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 600;
            color: #2d3748;
        }
    </style>
</head>
<body class="game-body">

    <!-- Unified Navigation -->
    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-3 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-brand text-brand">Playfull Minds</a>
            <div class="flex items-center space-x-6">
                <a href="index.html" class="text-gray-600 hover:text-brand font-medium">Games</a>
                <a href="dashboard.html" class="text-gray-600 hover:text-brand font-medium border-b-2 border-brand text-brand">Progress</a>
                <a href="rewards.html" class="text-gray-600 hover:text-brand font-medium">Rewards</a>
            </div>
        </nav>
    </header>

    <div class="game-container container mx-auto px-6 py-8 text-center">
        <h1 class="text-5xl md:text-7xl font-brand text-blue-600 mb-4 game-title">Parent/Teacher Dashboard 📊</h1>
        <p class="text-lg text-gray-600 mb-8 game-subtitle">Monitor your child's progress!</p>

        <div class="grid md:grid-cols-2 gap-8 mb-12">
            <div class="dashboard-card">
                <h2 class="text-3xl font-bold mb-2">Total Score</h2>
                <p id="dashboard-score" class="text-5xl font-brand text-yellow-500">0</p>
            </div>
            <div class="dashboard-card">
                <h2 class="text-3xl font-bold mb-2">Total Stars</h2>
                <p id="dashboard-stars" class="text-5xl font-brand text-yellow-500">0</p>
            </div>
        </div>

        <h2 class="text-4xl font-brand text-center text-gray-800 mb-8">Earned Badges</h2>
        <div id="dashboard-badges" class="flex flex-wrap justify-center mb-12">
            <!-- Badges will be dynamically inserted here -->
        </div>

        <h2 class="text-4xl font-brand text-center text-gray-800 mb-8">Recent Feedback 💬</h2>
        <div id="feedback-list" class="max-w-4xl mx-auto text-left space-y-4 mb-12">
            <!-- Feedback will be dynamically inserted here -->
        </div>

        <button id="clear-progress-btn" class="primary-btn bg-red-500 hover:bg-red-700 mt-12">Clear All Progress</button>

        <a href="index.html" class="back-link mt-12 block" title="Back to Main Menu">
            <span aria-hidden="true">⬅️</span>
            <span>Back to Main Menu</span>
        </a>
    </div>

    <script src="js/game-utils.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
